name: 校验并部署到 GitHub Pages

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 检查中文资源与脚本语法
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 检查中文资源和脚本语法
        run: npm test

  deploy:
    name: 发布 GitHub Pages
    # PR 只跑上面的校验。push 不触发本工作流，发布走手动 Run workflow
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传静态网页
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
